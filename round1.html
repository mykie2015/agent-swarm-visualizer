<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Round 1: Agent Nodes</title><style>*{margin:0;padding:0}body{font-family:-apple-system;background:#0a0e27;color:#fff;overflow:hidden}#c{display:block;width:100vw;height:100vh}.info{position:fixed;top:20px;left:20px;background:rgba(26,31,58,.9);padding:20px;border-radius:16px;backdrop-filter:blur(10px)}h1{font-size:1.5em;background:linear-gradient(135deg,#667eea,#764ba2);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:10px}p{color:#a0aec0;font-size:.9em}</style></head><body><canvas id="c"></canvas><div class="info"><h1>Round 1: Agent Nodes</h1><p>5 agents in 3D space</p><p>Auto-rotating view</p></div><script>const c=document.getElementById('c'),x=c.getContext('2d');c.width=innerWidth*devicePixelRatio;c.height=innerHeight*devicePixelRatio;x.scale(devicePixelRatio,devicePixelRatio);const agents=[{id:1,x:0,y:0,z:0,r:50,c:'#10b981',role:'Coordinator'},{id:2,x:-200,y:100,z:100,r:30,c:'#3b82f6',role:'Worker'},{id:3,x:200,y:100,z:100,r:30,c:'#3b82f6',role:'Worker'},{id:4,x:-200,y:-100,z:-100,r:30,c:'#f59e0b',role:'Analyzer'},{id:5,x:200,y:-100,z:-100,r:30,c:'#ef4444',role:'Reporter'}];let rot=0;function proj(x,y,z){const w=innerWidth,h=innerHeight,cs=Math.cos(rot),sn=Math.sin(rot),x1=x*cs-z*sn,z1=x*sn+z*cs,d=800,p=d/(d+z1);return{x:w/2+x1*p,y:h/2+y*p,z:z1,s:p}}function draw(){x.clearRect(0,0,innerWidth,innerHeight);agents.sort((a,b)=>proj(a.x,a.y,a.z).z-proj(b.x,b.y,b.z).z).forEach(a=>{const p=proj(a.x,a.y,a.z);if(p.z>0){const sz=a.r*p.s;x.fillStyle=a.c;x.shadowBlur=20;x.shadowColor=a.c;x.beginPath();x.arc(p.x,p.y,sz,0,Math.PI*2);x.fill();x.shadowBlur=0;x.fillStyle='white';x.font=`bold ${12*p.s}px sans-serif`;x.textAlign='center';x.textBaseline='middle';x.fillText(a.role,p.x,p.y)}});rot+=.005;requestAnimationFrame(draw)}draw()</script></body></html>

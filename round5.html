<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Round 5: Error Handling</title><style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:-apple-system;background:#0a0e27;color:#fff;display:flex;justify-content:center;align-items:center;min-height:100vh;padding:20px}#c{display:block;max-width:900px;width:100%;height:800px;border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,.5)}.info{position:fixed;top:20px;left:20px;background:rgba(26,31,58,.9);padding:20px;border-radius:16px;backdrop-filter:blur(10px);z-index:10}h1{font-size:1.5em;background:linear-gradient(135deg,#667eea,#764ba2);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:10px}p{color:#a0aec0;font-size:.9em}</style></head><body><canvas id="c"></canvas><div class="info"><h1>Round 5: Error Handling</h1><p>Failed tasks flash red</p><p>Automatic retry animations</p></div><script>const c=document.getElementById('c'),x=c.getContext('2d'),w=c.width=900*devicePixelRatio,h=c.height=800*devicePixelRatio;x.scale(devicePixelRatio,devicePixelRatio);const W=900,H=800;const agents=[{id:1,x:0,y:0,z:0,r:50,c:'#10b981',role:'Coordinator',tasks:[],busy:0,load:0,error:0},{id:2,x:-200,y:100,z:100,r:30,c:'#3b82f6',role:'Worker',tasks:[],busy:0,load:0,error:0},{id:3,x:200,y:100,z:100,r:30,c:'#3b82f6',role:'Worker',tasks:[],busy:0,load:0,error:0},{id:4,x:-200,y:-100,z:-100,r:30,c:'#f59e0b',role:'Analyzer',tasks:[],busy:0,load:0,error:0},{id:5,x:200,y:-100,z:-100,r:30,c:'#ef4444',role:'Reporter',tasks:[],busy:0,load:0,error:0}];const msgs=[],errors=[];class M{constructor(f,t,task){this.f=f;this.t=t;this.task=task;this.p=0;this.s=.02}u(){this.p+=this.s;if(this.p>=1){agents[this.t].tasks.push(this.task);return true}return false}d(r){const fa=agents[this.f],fb=agents[this.t],px=fa.x+(fb.x-fa.x)*this.p,py=fa.y+(fb.y-fa.y)*this.p,pz=fa.z+(fb.z-fa.z)*this.p,p=proj(px,py,pz,r);if(p.z>0){x.fillStyle=this.task.retry?'#f59e0b':'#667eea';x.shadowBlur=15;x.shadowColor=this.task.retry?'#f59e0b':'#667eea';x.beginPath();x.arc(p.x,p.y,8*p.s,0,Math.PI*2);x.fill();x.shadowBlur=0}}}class Err{constructor(ax,ay,az){this.x=ax;this.y=ay;this.z=az;this.life=30;this.r=10}u(){this.life--;return this.life<=0}d(r){const p=proj(this.x,this.y,this.z,r);if(p.z>0){const alpha=this.life/30;x.fillStyle=`rgba(239,68,68,${alpha})`;x.shadowBlur=20;x.shadowColor='#ef4444';x.beginPath();x.arc(p.x,p.y,this.r*p.s,0,Math.PI*2);x.fill();x.shadowBlur=0;x.strokeStyle=`rgba(255,255,255,${alpha})`;x.lineWidth=2;x.beginPath();x.moveTo(p.x-8*p.s,p.y-8*p.s);x.lineTo(p.x+8*p.s,p.y+8*p.s);x.moveTo(p.x+8*p.s,p.y-8*p.s);x.lineTo(p.x-8*p.s,p.y+8*p.s);x.stroke()}}}let rot=0,t=0,taskId=0,rebalanceTimer=0;const taskTypes=['Analyze','Process','Report','Compute','Validate'];function proj(px,py,pz,r){const cs=Math.cos(r),sn=Math.sin(r),x1=px*cs-pz*sn,z1=px*sn+pz*cs,d=800,s=d/(d+z1);return{x:W/2+x1*s,y:H/2+py*s,z:z1,s:s}}function getHeatColor(load){if(load<.3)return'#10b981';if(load<.6)return'#fbbf24';return'#ef4444'}function rebalance(){const workers=agents.slice(1);workers.sort((a,b)=>a.load-b.load);const overloaded=workers.filter(a=>a.tasks.length>2);const underloaded=workers.filter(a=>a.tasks.length<2);if(overloaded.length>0&&underloaded.length>0){const from=overloaded[0];const to=underloaded[0];if(from.tasks.length>0){const task=from.tasks.pop();msgs.push(new M(from.id,to.id,task))}}}function draw(){x.fillStyle='#0a0e27';x.fillRect(0,0,W,H);if(Math.random()<.04){const target=Math.floor(Math.random()*4)+1;msgs.push(new M(0,target,{id:taskId++,name:taskTypes[Math.floor(Math.random()*taskTypes.length)],progress:0,retry:0}))}rebalanceTimer++;if(rebalanceTimer>120){rebalance();rebalanceTimer=0}msgs.forEach((m,i)=>{if(m.u())msgs.splice(i,1);else m.d(rot)});errors.forEach((e,i)=>{if(e.u())errors.splice(i,1);else e.d(rot)});agents.forEach(a=>{if(a.tasks.length>0&&a.busy===0){a.busy=60;if(Math.random()<.2){a.error=30;const task=a.tasks.shift();errors.push(new E

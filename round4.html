<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Round 4: Load Balancing</title><style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:-apple-system;background:#0a0e27;color:#fff;display:flex;justify-content:center;align-items:center;min-height:100vh;padding:20px}#c{display:block;max-width:900px;width:100%;height:800px;border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,.5)}.info{position:fixed;top:20px;left:20px;background:rgba(26,31,58,.9);padding:20px;border-radius:16px;backdrop-filter:blur(10px);z-index:10}h1{font-size:1.5em;background:linear-gradient(135deg,#667eea,#764ba2);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:10px}p{color:#a0aec0;font-size:.9em}</style></head><body><canvas id="c"></canvas><div class="info"><h1>Round 4: Load Balancing</h1><p>Heat map: busy/idle agents</p><p>Auto-rebalancing tasks</p></div><script>const c=document.getElementById('c'),x=c.getContext('2d'),w=c.width=900*devicePixelRatio,h=c.height=800*devicePixelRatio;x.scale(devicePixelRatio,devicePixelRatio);const W=900,H=800;const agents=[{id:1,x:0,y:0,z:0,r:50,c:'#10b981',role:'Coordinator',tasks:[],busy:0,load:0},{id:2,x:-200,y:100,z:100,r:30,c:'#3b82f6',role:'Worker',tasks:[],busy:0,load:0},{id:3,x:200,y:100,z:100,r:30,c:'#3b82f6',role:'Worker',tasks:[],busy:0,load:0},{id:4,x:-200,y:-100,z:-100,r:30,c:'#f59e0b',role:'Analyzer',tasks:[],busy:0,load:0},{id:5,x:200,y:-100,z:-100,r:30,c:'#ef4444',role:'Reporter',tasks:[],busy:0,load:0}];const msgs=[];class M{constructor(f,t,task){this.f=f;this.t=t;this.task=task;this.p=0;this.s=.02}u(){this.p+=this.s;if(this.p>=1){agents[this.t].tasks.push(this.task);return true}return false}d(r){const fa=agents[this.f],fb=agents[this.t],px=fa.x+(fb.x-fa.x)*this.p,py=fa.y+(fb.y-fa.y)*this.p,pz=fa.z+(fb.z-fa.z)*this.p,p=proj(px,py,pz,r);if(p.z>0){x.fillStyle='#667eea';x.shadowBlur=15;x.shadowColor='#667eea';x.beginPath();x.arc(p.x,p.y,8*p.s,0,Math.PI*2);x.fill();x.shadowBlur=0}}}let rot=0,t=0,taskId=0,rebalanceTimer=0;const taskTypes=['Analyze','Process','Report','Compute','Validate'];function proj(px,py,pz,r){const cs=Math.cos(r),sn=Math.sin(r),x1=px*cs-pz*sn,z1=px*sn+pz*cs,d=800,s=d/(d+z1);return{x:W/2+x1*s,y:H/2+py*s,z:z1,s:s}}function getHeatColor(load){if(load<.3)return'#10b981';if(load<.6)return'#fbbf24';return'#ef4444'}function rebalance(){const workers=agents.slice(1);workers.sort((a,b)=>a.load-b.load);const overloaded=workers.filter(a=>a.tasks.length>2);const underloaded=workers.filter(a=>a.tasks.length<2);if(overloaded.length>0&&underloaded.length>0){const from=overloaded[0];const to=underloaded[0];if(from.tasks.length>0){const task=from.tasks.pop();msgs.push(new M(from.id,to.id,task))}}}function draw(){x.fillStyle='#0a0e27';x.fillRect(0,0,W,H);if(Math.random()<.04){const target=Math.floor(Math.random()*4)+1;msgs.push(new M(0,target,{id:taskId++,name:taskTypes[Math.floor(Math.random()*taskTypes.length)],progress:0}))}rebalanceTimer++;if(rebalanceTimer>120){rebalance();rebalanceTimer=0}msgs.forEach((m,i)=>{if(m.u())msgs.splice(i,1);else m.d(rot)});agents.forEach(a=>{if(a.tasks.length>0&&a.busy===0){a.busy=60}if(a.busy>0){a.busy--;if(a.busy===0&&a.tasks.length>0){a.tasks.shift()}}a.load=a.tasks.length/5;const p=proj(a.x,a.y,a.z,rot);if(p.z>0){const sz=a.r*p.s;const heatColor=getHeatColor(a.load);x.fillStyle=heatColor;x.shadowBlur=30;x.shadowColor=heatColor;x.beginPath();x.arc(p.x,p.y,sz,0,Math.PI*2);x.fill();x.shadowBlur=0;x.fillStyle='#fff';x.font=`bold ${12*p.s}px sans-serif`;x.textAlign='center';x.textBaseline='middle';x.fillText(a.role,p.x,p.y);if(a.tasks.length>0){x.fillStyle='#667eea';x.font=`${10*p.s}px sans-serif`;x.fillText(`[${a.tasks.length}]`,p.x,p.y+sz+15*p.s);if(a.busy>0){x.fillStyle='rgba(102,126,234,.3)';x.fillRect(p.x-sz,p.y+sz+20*p.s,sz*2*(1-a.busy/60),4*p.s)}}}});x.fillStyle='rgba(26,31,58,.8)';x.fillRect(10,H-80,200,60);x.fillStyle='#fff';x.font='12px sans-serif';x.fillText('Load Distribution:',20,H-60);agents.slice(1).forEach((a,i)=>{const barW=35;const barH=30*a.load;x.fillStyle=getHeatColor(a.load);x.fillRect(20+i*40,H-30-barH,barW,barH)});rot+=.005;requestAnimationFrame(draw)}draw()</script></body></html>

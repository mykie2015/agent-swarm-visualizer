<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Round 2: Communication</title><style>*{margin:0;padding:0}body{font-family:-apple-system;background:#0a0e27;color:#fff;overflow:hidden}#c{display:block;width:100vw;height:100vh}.info{position:fixed;top:20px;left:20px;background:rgba(26,31,58,.9);padding:20px;border-radius:16px}h1{font-size:1.5em;background:linear-gradient(135deg,#667eea,#764ba2);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:10px}p{color:#a0aec0;font-size:.9em}</style></head><body><canvas id="c"></canvas><div class="info"><h1>Round 2: Communication</h1><p>Messages flowing between agents</p><p>Animated pulses</p></div><script>const c=document.getElementById('c'),x=c.getContext('2d');c.width=innerWidth*devicePixelRatio;c.height=innerHeight*devicePixelRatio;x.scale(devicePixelRatio,devicePixelRatio);const agents=[{id:1,x:0,y:0,z:0,r:50,c:'#10b981'},{id:2,x:-200,y:100,z:100,r:30,c:'#3b82f6'},{id:3,x:200,y:100,z:100,r:30,c:'#3b82f6'},{id:4,x:-200,y:-100,z:-100,r:30,c:'#f59e0b'},{id:5,x:200,y:-100,z:-100,r:30,c:'#ef4444'}];const msgs=[];class M{constructor(f,t){this.f=f;this.t=t;this.p=0;this.s=.02}u(){this.p+=this.s;return this.p>1}d(r){const fa=agents[this.f],fb=agents[this.t],x=fa.x+(fb.x-fa.x)*this.p,y=fa.y+(fb.y-fa.y)*this.p,z=fa.z+(fb.z-fa.z)*this.p,p=proj(x,y,z,r);if(p.z>0){x.fillStyle='#667eea';x.shadowBlur=15;x.shadowColor='#667eea';x.beginPath();x.arc(p.x,p.y,8*p.s,0,Math.PI*2);x.fill();x.shadowBlur=0}}}let rot=0,t=0;function proj(x,y,z,r){const w=innerWidth,h=innerHeight,cs=Math.cos(r),sn=Math.sin(r),x1=x*cs-z*sn,z1=x*sn+z*cs,d=800,p=d/(d+z1);return{x:w/2+x1*p,y:h/2+y*p,z:z1,s:p}}function draw(){x.clearRect(0,0,innerWidth,innerHeight);if(Math.random()<.05)msgs.push(new M(0,Math.floor(Math.random()*4)+1));msgs.forEach((m,i)=>{if(m.u())msgs.splice(i,1);else m.d(rot)});agents.forEach(a=>{const p=proj(a.x,a.y,a.z,rot);if(p.z>0){const sz=a.r*p.s;x.fillStyle=a.c;x.shadowBlur=20;x.shadowColor=a.c;x.beginPath();x.arc(p.x,p.y,sz,0,Math.PI*2);x.fill();x.shadowBlur=0}});rot+=.005;requestAnimationFrame(draw)}draw()</script></body></html>

<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Round 9: Multi-Swarm</title><style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:-apple-system;background:#0a0e27;color:#fff;display:flex;justify-content:center;align-items:center;min-height:100vh;padding:20px}#c{display:block;max-width:900px;width:100%;height:800px;border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,.5)}.info{position:fixed;top:20px;left:20px;background:rgba(26,31,58,.9);padding:20px;border-radius:16px;backdrop-filter:blur(10px);z-index:10}h1{font-size:1.5em;background:linear-gradient(135deg,#667eea,#764ba2);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:10px}p{color:#a0aec0;font-size:.9em}.legend{position:fixed;bottom:20px;left:20px;background:rgba(26,31,58,.9);padding:15px;border-radius:16px;backdrop-filter:blur(10px)}.swarm{display:flex;align-items:center;margin:5px 0}.swarm-dot{width:12px;height:12px;border-radius:50%;margin-right:10px}.swarm-label{font-size:14px;color:#a0aec0}</style></head><body><canvas id="c"></canvas><div class="info"><h1>Round 9: Multi-Swarm</h1><p>Two swarms interact</p><p>Cross-swarm task trading</p></div><div class="legend"><div class="swarm"><div class="swarm-dot" style="background:#667eea"></div><div class="swarm-label">Swarm Alpha</div></div><div class="swarm"><div class="swarm-dot" style="background:#764ba2"></div><div class="swarm-label">Swarm Beta</div></div></div><script>const c=document.getElementById('c'),x=c.getContext('2d'),w=c.width=900*devicePixelRatio,h=c.height=800*devicePixelRatio;x.scale(devicePixelRatio,devicePixelRatio);const W=900,H=800;const swarmA=[{id:1,x:-300,y:0,z:0,r:40,c:'#667eea',role:'Alpha-Lead',tasks:[],busy:0,swarm:'A'},{id:2,x:-400,y:100,z:50,r:25,c:'#667eea',role:'A-Worker',tasks:[],busy:0,swarm:'A'},{id:3,x:-200,y:100,z:50,r:25,c:'#667eea',role:'A-Worker',tasks:[],busy:0,swarm:'A'}];const swarmB=[{id:4,x:300,y:0,z:0,r:40,c:'#764ba2',role:'Beta-Lead',tasks:[],busy:0,swarm:'B'},{id:5,x:400,y:100,z:50,r:25,c:'#764ba2',role:'B-Worker',tasks:[],busy:0,swarm:'B'},{id:6,x:200,y:100,z:50,r:25,c:'#764ba2',role:'B-Worker',tasks:[],busy:0,swarm:'B'}];const agents=[...swarmA,...swarmB];const msgs=[];let rot=0,taskId=0;const taskTypes=['Analyze','Process','Report','Compute','Validate'];class M{constructor(f,t,task,cross){this.f=f;this.t=t;this.task=task;this.p=0;this.s=cross?.01:.02;this.cross=cross}u(){this.p+=this.s;if(this.p>=1){agents[this.t].tasks.push(this.task);return true}return false}d(r){const fa=agents[this.f],fb=agents[this.t],px=fa.x+(fb.x-fa.x)*this.p,py=fa.y+(fb.y-fa.y)*this.p,pz=fa.z+(fb.z-fa.z)*this.p,p=proj(px,py,pz,r);if(p.z>0){x.fillStyle=this.cross?'#f59e0b':'#667eea';x.shadowBlur=this.cross?20:15;x.shadowColor=this.cross?'#f59e0b':'#667eea';x.beginPath();x.arc(p.x,p.y,this.cross?10:8*p.s,0,Math.PI*2);x.fill();x.shadowBlur=0}}}function proj(px,py,pz,r){const cs=Math.cos(r),sn=Math.sin(r),x1=px*cs-pz*sn,z1=px*sn+pz*cs,d=800,s=d/(d+z1);return{x:W/2+x1*s,y:H/2+py*s,z:z1,s:s}}function tradeTask(){const overloadedA=swarmA.filter(a=>a.tasks.length>3);const underloadedB=swarmB.filter(a=>a.tasks.length<2);const overloadedB=swarmB.filter(a=>a.tasks.length>3);const underloadedA=swarmA.filter(a=>a.tasks.length<2);if(overloadedA.length>0&&underloadedB.length>0){const from=overloadedA[0];const to=underloadedB[0];if(from.tasks.length>0){const task=from.tasks.pop();msgs.push(new M(from.id,to.id,task,true))}}else if(overloadedB.length>0&&underloadedA.length>0){const from=overloadedB[0];const to=underloadedA[0];if(from.tasks.length>0){const task=from.tasks.pop();msgs.push(new M(from.id,to.id,task,true))}}}let tradeTimer=0;function draw(){x.fillStyle='#0a0e27';x.fillRect(0,0,W,H);x.strokeStyle='rgba(102,126,234,.1)';x.lineWidth=2;x.setLineDash([5,5]);x.beginPath();x.moveTo(W/2,0);x.lineTo(W/2,H);x.stroke();x.setLineDash([]);if(Math.random()<.06){const swarm=Math.random()<.5?swarmA:swarmB;const target=swarm[Math.floor(Math.random()*(swarm.length-1))+1];msgs.push(new M(swarm[0].id,target.id,{id:taskId++,name:taskTypes[Math.floor(Math.random()*taskTypes.length)]},false))}tradeTimer++;if(tradeTimer>100){tradeTask();tradeTimer=0}msgs.forEach((m,i)=>{if(m.u())msgs.splice(i,1);else m.d(rot)});agents.forEach(a=>{if(a.tasks.length>0&&a.busy===0){a.busy=60}if(a.busy>0){a.busy--;if(a.busy===0&&a.tasks.length>0){a.tasks.shift()}}const p=proj(a.x,a.y,a.z,rot);if(p.z>0){const sz=a.r*p.s;x.fillStyle=a.c;x.shadowBlur=30;x.shadowColor=a.c;x.beginPath();x.arc(p.x,p.y,sz,0,Math.PI*2);x.fill();x.shadowBlur=0;x.fillStyle='#fff';x.font=`bold ${11*p.s}px sans-serif`;x.textAlign='center';x.textBaseline='middle';x.fillText(a.role,p.x,p.y);if(a.tasks.length>0){x.fillStyle='#fbbf24';x.font=`${10*p.s}px sans-serif`;x.fillText(`[${a.tasks.length}]`,p.x,p.y+sz+15*p.s);if(a.busy>0){x.fillStyle='rgba(251,191,36,.3)';x.fillRect(p.x-sz,p.y+sz+20*p.s,sz*2*(1-a.busy/60),4*p.s)}}}});rot+=.005;requestAnimationFrame(draw)}draw()</script></body></html>

<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Round 8: Metrics Dashboard</title><style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:-apple-system;background:#0a0e27;color:#fff;display:flex;justify-content:center;align-items:center;min-height:100vh;padding:20px}#c{display:block;max-width:900px;width:100%;height:800px;border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,.5)}.info{position:fixed;top:20px;left:20px;background:rgba(26,31,58,.9);padding:20px;border-radius:16px;backdrop-filter:blur(10px);z-index:10}h1{font-size:1.5em;background:linear-gradient(135deg,#667eea,#764ba2);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:10px}p{color:#a0aec0;font-size:.9em}.metrics{position:fixed;top:20px;right:20px;background:rgba(26,31,58,.9);padding:20px;border-radius:16px;backdrop-filter:blur(10px);min-width:200px}.metric{margin-bottom:15px}.metric-label{color:#667eea;font-size:12px;margin-bottom:5px}.metric-value{font-size:24px;font-weight:bold;background:linear-gradient(135deg,#667eea,#764ba2);-webkit-background-clip:text;-webkit-text-fill-color:transparent}.metric-bar{height:6px;background:rgba(102,126,234,.2);border-radius:3px;margin-top:5px;overflow:hidden}.metric-fill{height:100%;background:linear-gradient(135deg,#667eea,#764ba2);transition:width .3s}</style></head><body><canvas id="c"></canvas><div class="info"><h1>Round 8: Metrics Dashboard</h1><p>Real-time performance stats</p><p>Throughput & success rate</p></div><div class="metrics"><div class="metric"><div class="metric-label">Throughput</div><div class="metric-value" id="throughput">0</div><div class="metric-bar"><div class="metric-fill" id="throughputBar" style="width:0%"></div></div></div><div class="metric"><div class="metric-label">Latency (avg)</div><div class="metric-value" id="latency">0ms</div><div class="metric-bar"><div class="metric-fill" id="latencyBar" style="width:0%"></div></div></div><div class="metric"><div class="metric-label">Success Rate</div><div class="metric-value" id="success">100%</div><div class="metric-bar"><div class="metric-fill" id="successBar" style="width:100%"></div></div></div><div class="metric"><div class="metric-label">Active Tasks</div><div class="metric-value" id="active">0</div></div></div><script>const c=document.getElementById('c'),x=c.getContext('2d'),w=c.width=900*devicePixelRatio,h=c.height=800*devicePixelRatio;x.scale(devicePixelRatio,devicePixelRatio);const W=900,H=800;const agents=[{id:1,x:0,y:0,z:0,r:50,c:'#10b981',role:'Coordinator',tasks:[],busy:0},{id:2,x:-200,y:100,z:100,r:30,c:'#3b82f6',role:'Worker',tasks:[],busy:0},{id:3,x:200,y:100,z:100,r:30,c:'#3b82f6',role:'Worker',tasks:[],busy:0},{id:4,x:-200,y:-100,z:-100,r:30,c:'#f59e0b',role:'Analyzer',tasks:[],busy:0},{id:5,x:200,y:-100,z:-100,r:30,c:'#ef4444',role:'Reporter',tasks:[],busy:0}];const msgs=[];let rot=0,taskId=0,completed=0,failed=0,totalLatency=0,frame=0;const taskTypes=['Analyze','Process','Report','Compute','Validate'];class M{constructor(f,t,task){this.f=f;this.t=t;this.task=task;this.p=0;this.s=.02;this.startTime=Date.now()}u(){this.p+=this.s;if(this.p>=1){agents[this.t].tasks.push({...this.task,startTime:this.startTime});return true}return false}d(r){const fa=agents[this.f],fb=agents[this.t],px=fa.x+(fb.x-fa.x)*this.p,py=fa.y+(fb.y-fa.y)*this.p,pz=fa.z+(fb.z-fa.z)*this.p,p=proj(px,py,pz,r);if(p.z>0){x.fillStyle='#667eea';x.shadowBlur=15;x.shadowColor='#667eea';x.beginPath();x.arc(p.x,p.y,8*p.s,0,Math.PI*2);x.fill();x.shadowBlur=0}}}function proj(px,py,pz,r){const cs=Math.cos(r),sn=Math.sin(r),x1=px*cs-pz*sn,z1=px*sn+pz*cs,d=800,s=d/(d+z1);return{x:W/2+x1*s,y:H/2+py*s,z:z1,s:s}}function updateMetrics(){const throughput=Math.round(completed/((frame+1)/60));const avgLatency=completed>0?Math.round(totalLatency/completed):0;const successRate=completed+failed>0?Math.round(completed/(completed+failed)*100):100;const activeTasks=agents.reduce((sum,a)=>sum+a.tasks.length,0);document.getElementById('throughput').textContent=throughput+'/s';document.getElementById('throughputBar').style.width=Math.min(throughput*10,100)+'%';document.getElementById('latency').textContent=avgLatency+'ms';document.getElementById('latencyBar').style.width=Math.min(avgLatency/10,100)+'%';document.getElementById('success').textContent=successRate+'%';document.getElementById('successBar').style.width=successRate+'%';document.getElementById('active').textContent=activeTasks}function draw(){x.fillStyle='#0a0e27';x.fillRect(0,0,W,H);if(Math.random()<.05){const target=Math.floor(Math.random()*4)+1;msgs.push(new M(0,target,{id:taskId++,name:taskTypes[Math.floor(Math.random()*taskTypes.length)]}))}msgs.forEach((m,i)=>{if(m.u())msgs.splice(i,1);else m.d(rot)});agents.forEach(a=>{if(a.tasks.length>0&&a.busy===0){a.busy=60;if(Math.random()<.15){failed++;a.tasks.shift()}else{const task=a.tasks[0];if(task.startTime){const latency=Date.now()-task.startTime;totalLatency+=latency}}}if(a.busy>0){a.busy--;if(a.busy===0&&a.tasks.length>0){completed++;a.tasks.shift()}}const p=proj(a.x,a.y,a.z,rot);if(p.z>0){const sz=a.r*p.s;x.fillStyle=a.c;x.shadowBlur=30;x.shadowColor=a.c;x.beginPath();x.arc(p.x,p.y,sz,0,Math.PI*2);x.fill();x.shadowBlur=0;x.fillStyle='#fff';x.font=`bold ${12*p.s}px sans-serif`;x.textAlign='center';x.textBaseline='middle';x.fillText(a.role,p.x,p.y);if(a.tasks.length>0){x.fillStyle='#667eea';x.font=`${10*p.s}px sans-serif`;x.fillText(`[${a.tasks.length}]`,p.x,p.y+sz+15*p.s);if(a.busy>0){x.fillStyle='rgba(102,126,234,.3)';x.fillRect(p.x-sz,p.y+sz+20*p.s,sz*2*(1-a.busy/60),4*p.s)}}}});frame++;if(frame%10===0)updateMetrics();rot+=.005;requestAnimationFrame(draw)}draw()</script></body></html>

<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Round 6: Swarm Clustering</title><style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:-apple-system;background:#0a0e27;color:#fff;display:flex;justify-content:center;align-items:center;min-height:100vh;padding:20px}#c{display:block;max-width:900px;width:100%;height:800px;border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,.5)}.info{position:fixed;top:20px;left:20px;background:rgba(26,31,58,.9);padding:20px;border-radius:16px;backdrop-filter:blur(10px);z-index:10}h1{font-size:1.5em;background:linear-gradient(135deg,#667eea,#764ba2);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:10px}p{color:#a0aec0;font-size:.9em}</style></head><body><canvas id="c"></canvas><div class="info"><h1>Round 6: Swarm Clustering</h1><p>Agents self-organize by task type</p><p>Dynamic cluster formation</p></div><script>const c=document.getElementById('c'),x=c.getContext('2d'),w=c.width=900*devicePixelRatio,h=c.height=800*devicePixelRatio;x.scale(devicePixelRatio,devicePixelRatio);const W=900,H=800;const clusters={Analyze:{x:-250,y:-150,z:0,c:'#f59e0b'},Process:{x:250,y:-150,z:0,c:'#3b82f6'},Report:{x:0,y:150,z:0,c:'#ef4444'},Compute:{x:-250,y:150,z:0,c:'#8b5cf6'},Validate:{x:250,y:150,z:0,c:'#10b981'}};const agents=[{id:1,x:0,y:0,z:0,r:50,c:'#10b981',role:'Coordinator',tasks:[],busy:0,cluster:null,tx:0,ty:0},{id:2,x:-200,y:100,z:100,r:30,c:'#3b82f6',role:'Worker',tasks:[],busy:0,cluster:null,tx:-200,ty:100},{id:3,x:200,y:100,z:100,r:30,c:'#3b82f6',role:'Worker',tasks:[],busy:0,cluster:null,tx:200,ty:100},{id:4,x:-200,y:-100,z:-100,r:30,c:'#f59e0b',role:'Analyzer',tasks:[],busy:0,cluster:null,tx:-200,ty:-100},{id:5,x:200,y:-100,z:-100,r:30,c:'#ef4444',role:'Reporter',tasks:[],busy:0,cluster:null,tx:200,ty:-100}];const msgs=[],errors=[];class M{constructor(f,t,task){this.f=f;this.t=t;this.task=task;this.p=0;this.s=.02}u(){this.p+=this.s;if(this.p>=1){agents[this.t].tasks.push(this.task);return true}return false}d(r){const fa=agents[this.f],fb=agents[this.t],px=fa.x+(fb.x-fa.x)*this.p,py=fa.y+(fb.y-fa.y)*this.p,pz=fa.z+(fb.z-fa.z)*this.p,p=proj(px,py,pz,r);if(p.z>0){x.fillStyle='#667eea';x.shadowBlur=15;x.shadowColor='#667eea';x.beginPath();x.arc(p.x,p.y,8*p.s,0,Math.PI*2);x.fill();x.shadowBlur=0}}}let rot=0,taskId=0;const taskTypes=['Analyze','Process','Report','Compute','Validate'];function proj(px,py,pz,r){const cs=Math.cos(r),sn=Math.sin(r),x1=px*cs-pz*sn,z1=px*sn+pz*cs,d=800,s=d/(d+z1);return{x:W/2+x1*s,y:H/2+py*s,z:z1,s:s}}function updateClusters(){agents.slice(1).forEach(a=>{if(a.tasks.length>0){const taskType=a.tasks[0].name;if(clusters[taskType]){a.cluster=taskType}}else{a.cluster=null}})}function draw(){x.fillStyle='#0a0e27';x.fillRect(0,0,W,H);Object.entries(clusters).forEach(([name,cl])=>{const p=proj(cl.x,cl.y,cl.z,rot);if(p.z>0){x.fillStyle=cl.c+'20';x.shadowBlur=40;x.shadowColor=cl.c;x.beginPath();x.arc(p.x,p.y,80*p.s,0,Math.PI*2);x.fill();x.shadowBlur=0;x.fillStyle=cl.c;x.font='10px sans-serif';x.textAlign='center';x.fillText(name,p.x,p.y)}});if(Math.random()<.04){const target=Math.floor(Math.random()*4)+1;msgs.push(new M(0,target,{id:taskId++,name:taskTypes[Math.floor(Math.random()*taskTypes.length)],progress:0}))}updateClusters();msgs.forEach((m,i)=>{if(m.u())msgs.splice(i,1);else m.d(rot)});agents.forEach(a=>{if(a.cluster&&clusters[a.cluster]){const cl=clusters[a.cluster];a.tx=cl.x+(Math.random()-.5)*60;a.ty=cl.y+(Math.random()-.5)*60}else if(!a.cluster&&a.id>1){a.tx=a.id===2?-200:a.id===3?200:a.id===4?-200:200;a.ty=a.id===2?100:a.id===3?100:a.id===4?-100:-100}a.x+=(a.tx-a.x)*.05;a.y+=(a.ty-a.y)*.05;if(a.tasks.length>0&&a.busy===0){a.busy=60}if(a.busy>0){a.busy--;if(a.busy===0&&a.tasks.length>0){a.tasks.shift()}}const p=proj(a.x,a.y,a.z,rot);if(p.z>0){const sz=a.r*p.s;x.fillStyle=a.cluster?clusters[a.cluster].c:a.c;x.shadowBlur=30;x.shadowColor=a.cluster?clusters[a.cluster].c:a.c;x.beginPath();x.arc(p.x,p.y,sz,0,Math.PI*2);x.fill();x.shadowBlur=0;x.fillStyle='#fff';x.font=`bold ${12*p.s}px sans-serif`;x.textAlign='center';x.textBaseline='middle';x.fillText(a.role,p.x,p.y);if(a.tasks.length>0){x.fillStyle='#667eea';x.font=`${10*p.s}px sans-serif`;x.fillText(`[${a.tasks.length}]`,p.x,p.y+sz+15*p.s)}}});rot+=.005;requestAnimationFrame(draw)}draw()</script></body></html>

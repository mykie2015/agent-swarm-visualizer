<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Round 10: The Ultimate</title><style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:-apple-system;background:#0a0e27;color:#fff;display:flex;justify-content:center;align-items:center;min-height:100vh;padding:20px}#c{display:block;max-width:900px;width:100%;height:800px;border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,.5)}.info{position:fixed;top:20px;left:20px;background:rgba(26,31,58,.9);padding:20px;border-radius:16px;backdrop-filter:blur(10px);z-index:10}h1{font-size:1.5em;background:linear-gradient(135deg,#667eea,#764ba2);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:10px}p{color:#a0aec0;font-size:.9em}.controls{position:fixed;top:20px;right:20px;background:rgba(26,31,58,.9);padding:20px;border-radius:16px;backdrop-filter:blur(10px);z-index:10}.mode-btn{background:linear-gradient(135deg,#667eea,#764ba2);border:none;color:#fff;padding:10px 20px;margin:5px 0;border-radius:8px;cursor:pointer;width:100%;font-size:14px;transition:transform .2s}.mode-btn:hover{transform:scale(1.05)}.mode-btn.active{box-shadow:0 0 20px rgba(102,126,234,.5)}.metrics{position:fixed;bottom:20px;right:20px;background:rgba(26,31,58,.9);padding:15px;border-radius:16px;backdrop-filter:blur(10px);min-width:180px}.metric{margin:8px 0;font-size:12px}.metric-label{color:#667eea}.metric-value{color:#fff;font-weight:bold}.scrubber{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);width:60%;background:rgba(26,31,58,.9);padding:15px;border-radius:16px;backdrop-filter:blur(10px);display:none}input[type=range]{width:100%;height:4px;border-radius:2px;background:linear-gradient(135deg,#667eea,#764ba2);outline:none;-webkit-appearance:none}input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:#fff;cursor:pointer}input[type=range]::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:#fff;cursor:pointer;border:none}</style></head><body><canvas id="c"></canvas><div class="info"><h1>Round 10: The Ultimate</h1><p id="modeDesc">All features combined</p></div><div class="controls"><button class="mode-btn active" onclick="setMode('standard')">Standard</button><button class="mode-btn" onclick="setMode('clustering')">Clustering</button><button class="mode-btn" onclick="setMode('multiswarm')">Multi-Swarm</button><button class="mode-btn" onclick="setMode('timeline')">Timeline</button></div><div class="metrics"><div class="metric"><span class="metric-label">Tasks:</span> <span class="metric-value" id="tasks">0</span></div><div class="metric"><span class="metric-label">Completed:</span> <span class="metric-value" id="completed">0</span></div><div class="metric"><span class="metric-label">Failed:</span> <span class="metric-value" id="failed">0</span></div><div class="metric"><span class="metric-label">Success:</span> <span class="metric-value" id="success">100%</span></div><div class="metric"><span class="metric-label">Throughput:</span> <span class="metric-value" id="throughput">0/s</span></div></div><div class="scrubber" id="scrubber"><input type="range" id="timeline" min="0" max="1000" value="1000"><div style="color:#667eea;font-size:12px;margin-top:5px;text-align:center">Time: <span id="timeDisplay">100%</span></div></div><script>const c=document.getElementById('c'),x=c.getContext('2d'),w=c.width=900*devicePixelRatio,h=c.height=800*devicePixelRatio;x.scale(devicePixelRatio,devicePixelRatio);const W=900,H=800;let mode='standard';const clusters={Analyze:{x:-250,y:-150,z:0,c:'#f59e0b'},Process:{x:250,y:-150,z:0,c:'#3b82f6'},Report:{x:0,y:150,z:0,c:'#ef4444'},Compute:{x:-250,y:150,z:0,c:'#8b5cf6'},Validate:{x:250,y:150,z:0,c:'#10b981'}};const swarmA=[{id:1,x:-300,y:0,z:0,r:40,c:'#667eea',role:'Alpha-Lead',tasks:[],busy:0,swarm:'A',ox:-300,oy:0,cluster:null,tx:-300,ty:0},{id:2,x:-400,y:100,z:50,r:25,c:'#667eea',role:'A-Work',tasks:[],busy:0,swarm:'A',ox:-400,oy:100,cluster:null,tx:-400,ty:100},{id:3,x:-200,y:100,z:50,r:25,c:'#667eea',role:'A-Work',tasks:[],busy:0,swarm:'A',ox:-200,oy:100,cluster:null,tx:-200,ty:100}];const swarmB=[{id:4,x:300,y:0,z:0,r:40,c:'#764ba2',role:'Beta-Lead',tasks:[],busy:0,swarm:'B',ox:300,oy:0,cluster:null,tx:300,ty:0},{id:5,x:400,y:100,z:50,r:25,c:'#764ba2',role:'B-Work',tasks:[],busy:0,swarm:'B',ox:400,oy:100,cluster:null,tx:400,ty:100},{id:6,x:200,y:100,z:50,r:25,c:'#764ba2',role:'B-Work',tasks:[],busy:0,swarm:'B',ox:200,oy:100,cluster:null,tx:200,ty:100}];const standardAgents=[{id:1,x:0,y:0,z:0,r:50,c:'#10b981',role:'Coordinator',tasks:[],busy:0,ox:0,oy:0,cluster:null,tx:0,ty:0},{id:2,x:-200,y:100,z:100,r:30,c:'#3b82f6',role:'Worker',tasks:[],busy:0,ox:-200,oy:100,cluster:null,tx:-200,ty:100},{id:3,x:200,y:100,z:100,r:30,c:'#3b82f6',role:'Worker',tasks:[],busy:0,ox:200,oy:100,cluster:null,tx:200,ty:100},{id:4,x:-200,y:-100,z:-100,r:30,c:'#f59e0b',role:'Analyzer',tasks:[],busy:0,ox:-200,oy:-100,cluster:null,tx:-200,ty:-100},{id:5,x:200,y:-100,z:-100,r:30,c:'#ef4444',role:'Reporter',tasks:[],busy:0,ox:200,oy:-100,cluster:null,tx:200,ty:-100}];let agents=[...standardAgents];const msgs=[],errors=[],history=[];let rot=0,taskId=0,completedCount=0,failedCount=0,frame=0,playing=true,tradeTimer=0;const taskTypes=['Analyze','Process','Report','Compute','Validate'];class M{constructor(f,t,task,cross){this.f=f;this.t=t;this.task=task;this.p=0;this.s=cross?.01:.02;this.cross=cross}u(){this.p+=this.s;if(this.p>=1){const agent=agents.find(a=>a.id===this.t);if(agent)agent.tasks.push(this.task);return true}return false}d(r){const fa=agents.find(a=>a.id===this.f);const fb=agents.find(a=>a.id===this.t);if(!fa||!fb)return;const px=fa.x+(fb.x-fa.x)*this.p,py=fa.y+(fb.y-fa.y)*this.p,pz=fa.z+(fb.z-fa.z)*this.p,p=proj(px,py,pz,r);if(p.z>0){x.fillStyle=this.cross?'#f59e0b':'#667eea';x.shadowBlur=this.cross?20:15;x.shadowColor=this.cross?'#f59e0b':'#667eea';x.beginPath();x.arc(p.x,p.y,this.cross?10:8*p.s,0,Math.PI*2);x.fill();x.shadowBlur=0}}}class Err{constructor(ax,ay,az){this.x=ax;this.y=ay;this.z=az;this.life=30;this.r=10}u(){this.life--;return this.life<=0}d(r){const p=proj(this.x,this.y,this.z,r);if(p.z>0){const alpha=this.life/30;x.fillStyle=`rgba(239,68,68,${alpha})`;x.shadowBlur=20;x.shadowColor='#ef4444';x.beginPath();x.arc(p.x,p.y,this.r*p.s,0,Math.PI*2);x.fill();x.shadowBlur=0}}}function proj(px,py,pz,r){const cs=Math.cos(r),sn=Math.sin(r),x1=px*cs-pz*sn,z1=px*sn+pz*cs,d=800,s=d/(d+z1);return{x:W/2+x1*s,y:H/2+py*s,z:z1,s:s}}function setMode(m){mode=m;document.querySelectorAll('.mode-btn').forEach(b=>b.classList.remove('active'));event.target.classList.add('active');document.getElementById('scrubber').style.display=m==='timeline'?'block':'none';const descs={standard:'Task delegation & error handling',clustering:'Agents cluster by task type',multiswarm:'Two swarms trading tasks',timeline:'Replay swarm history'};document.getElementById('modeDesc').textContent=descs[m];if(m==='multiswarm'){agents=[...swarmA,...swarmB]}else{agents=[...standardAgents]}msgs.length=0;errors.length=0}function updateClusters(){if(mode!=='clustering')return;agents.forEach(a=>{if(a.tasks.length>0){const taskType=a.tasks[0].name;if(clusters[taskType]){a.cluster=taskType;const cl=clusters[taskType];a.tx=cl.x+(Math.random()-.5)*60;a.ty=cl.y+(Math.random()-.5)*60}}else{a.cluster=null;a.tx=a.ox;a.ty=a.oy}})}function tradeTask(){if(mode!=='multiswarm')return;const aAgents=agents.filter(a=>a.swarm==='A');const bAgents=agents.filter(a=>a.swarm==='B');const overA=aAgents.filter(a=>a.tasks.length>3);const underB=bAgents.filter(a=>a.tasks.length<2);const overB=bAgents.filter(a=>a.tasks.length>3);const underA=aAgents.filter(a=>a.tasks.length<2);if(overA.length>0&&underB.length>0){const from=overA[0];const to=underB[0];if(from.tasks.length>0){const task=from.tasks.pop();msgs.push(new M(from.id,to.id,task,true))}}else if(overB.length>0&&underA.length>0){const from=overB[0];const to=underA[0];if(from.tasks.length>0){const task=from.tasks.pop();msgs.push(new M(from.id,to.id,task,true))}}}function draw(){x.fillStyle='#0a0e27';x.fillRect(0,0,W,H);if(mode==='clustering'){Object.entries(clusters).forEach(([name,cl])=>{const p=proj(cl.x,cl.y,cl.z,rot);if(p.z>0){x.fillStyle=cl.c+'20';x.shadowBlur=40;x.shadowColor=cl.c;x.beginPath();x.arc(p.x,p.y,80*p.s,0,Math.PI*2);x.fill();x.shadowBlur=0}})}if(mode==='multiswarm'){x.strokeStyle='rgba(102,126,234,.1)';x.lineWidth=2;x.setLineDash([5,5]);x.beginPath();x.moveTo(W/2,0);x.lineTo(W/2,H);x.stroke();x.setLineDash([])}if(playing||mode!=='timeline'){if(Math.random()<.05){if(mode==='multiswarm'){const swarm=Math.random()<.5?agents.filter(a=>a.swarm==='A'):agents.filter(a=>a.swarm==='B');const target=swarm[Math.floor(Math.random()*(swarm.length-1))+1];msgs.push(new M(swarm[0].id,target.id,{id:taskId++,name:taskTypes[Math.floor(Math.random()*taskTypes.length)]},false))}else{const target=agents[Math.floor(Math.random()*(agents.length-1))+1];msgs.push(new M(agents[0].id,target.id,{id:taskId++,name:taskTypes[Math.floor(Math.random()*taskTypes.length)]},false))}}if(mode==='multiswarm'){tradeTimer++;if(tradeTimer>100){tradeTask();tradeTimer=0}}updateClusters()}msgs.forEach((m,i)=>{if(m.u())msgs.splice(i,1);else m.d(rot)});errors.forEach((e,i)=>{if(e.u())errors.splice(i,1);else e.d(rot)});agents.forEach(a=>{if(mode==='clustering'){a.x+=(a.tx-a.x)*.05;a.y+=(a.ty-a.y)*.05}if(a.tasks.length>0&&a.busy===0){a.busy=60;if(Math.random()<.15){failedCount++;errors.push(new Err(a.x,a.y,a.z));const task=a.tasks.shift();setTimeout(()=>{if(agents.includes(a))msgs.push(new M(agents[0].id,a.id,task,false))},500)}}if(a.busy>0){a.busy--;if(a.busy===0&&a.tasks.length>0){completedCount++;a.tasks.shift()}}const p=proj(a.x,a.y,a.z,rot);if(p.z>0){const sz=a.r*p.s;x.fillStyle=a.cluster&&mode==='clustering'?clusters[a.cluster].c:a.c;x.shadowBlur=30;x.shadowColor=a.cluster&&mode==='clustering'?clusters[a.cluster].c:a.c;x.beginPath();x.arc(p.x,p.y,sz,0,Math.PI*2);x.fill();x.shadowBlur=0;x.fillStyle='#fff';x.font=`bold ${11*p.s}px sans-serif`;x.textAlign='center';x.textBaseline='middle';x.fillText(a.role,p.x,p.y);if(a.tasks.length>0){x.fillStyle='#fbbf24';x.font=`${10*p.s}px sans-serif`;x.fillText(`[${a.tasks.length}]`,p.x,p.y+sz+15*p.s);if(a.busy>0){x.fillStyle='rgba(251,191,36,.3)';x.fillRect(p.x-sz,p.y+sz+20*p.s,sz*2*(1-a.busy/60),4*p.s)}}}});const totalTasks=agents.reduce((s,a)=>s+a.tasks.length,0);const successRate=completedCount+failedCount>0?Math.round(completedCount/(completedCount+failedCount)*100):100;const throughput=Math.round(completedCount/((frame+1)/60));document.getElementById('tasks').textContent=totalTasks;document.getElementById('completed').textContent=completedCount;document.getElementById('failed').textContent=failedCount;document.getElementById('success').textContent=successRate+'%';document.getElementById('throughput').textContent=throughput+'/s';frame++;rot+=.005;requestAnimationFrame(draw)}const timeline=document.getElementById('timeline');timeline.addEventListener('input',e=>{playing=false;frame=parseInt(e.target.value);document.getElementById('timeDisplay').textContent=Math.round(frame/10)+'%'});timeline.addEventListener('change',()=>{playing=true});draw()</script></body></html>
